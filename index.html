<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>بازی مدیریت قطار (Tiny Rails Style) - نسخه پیشرفته</title>
    <link
      rel="shortcut icon"
      href="./favicon.ico"
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="./src/assets/css/index.css"
    />
  </head>
  <body>
    <div id="game-container">
      <!-- پنل وضعیت بازی -->
      <div id="hud">
        <div class="hud-panel">
          <div>امتیاز: <span id="score-val">0</span></div>
          <div>مسافران کل: <span id="passengers-val">12</span> نفر</div>
        </div>
        <div class="hud-panel">
          <div id="station-alert">
            ⚠️ در حال نزدیک شدن به ایستگاه! ترمز کنید!
          </div>
          <div style="direction: ltr">
            SPEED: <span id="speed-val">0</span> km/h
          </div>
        </div>
      </div>

      <!-- لایه کوه‌ها -->
      <div
        class="mountain-layer"
        id="mountains"
      ></div>

      <!-- لایه متحرک المان‌ها (ایستگاه، درخت، مانع) -->
      <div
        class="scenery-container"
        id="scenery-layer"
      >
        <!-- محتوا پویا توسط جی‌اس تزریق می‌شود -->
      </div>

      <!-- ریل -->
      <div id="railway-container">
        <div id="railway"></div>
      </div>

      <!-- قطار طولانی تر (۵ واگن + ۱ لوکوموتیو) -->
      <div id="train-group">
        <div class="wagon">
          <div class="wagon-windows"></div>
          <div class="wheel-pair">
            <div class="wheel"></div>
            <div class="wheel"></div>
          </div>
        </div>
        <div class="wagon">
          <div class="wagon-windows"></div>
          <div class="wheel-pair">
            <div class="wheel"></div>
            <div class="wheel"></div>
          </div>
        </div>
        <div class="wagon">
          <div class="wagon-windows"></div>
          <div class="wheel-pair">
            <div class="wheel"></div>
            <div class="wheel"></div>
          </div>
        </div>
        <div class="wagon">
          <div class="wagon-windows"></div>
          <div class="wheel-pair">
            <div class="wheel"></div>
            <div class="wheel"></div>
          </div>
        </div>
        <div class="wagon">
          <div class="wagon-windows"></div>
          <div class="wheel-pair">
            <div class="wheel"></div>
            <div class="wheel"></div>
          </div>
        </div>
        <div class="locomotive">
          <div class="cabin"></div>
          <div class="chimney"></div>
          <div class="smoke-container"><div class="smoke"></div></div>
          <div
            class="wheel-pair"
            style="left: 10px; right: 10px"
          >
            <div class="wheel"></div>
            <div class="wheel"></div>
            <div class="wheel"></div>
          </div>
        </div>
      </div>

      <!-- دکمه‌های کنترلی پایین صفحه -->
      <div id="controls-bar">
        <button
          class="btn btn-orange"
          id="btn-slow"
        >
          کاهش سرعت
        </button>
        <button
          class="btn btn-red"
          id="btn-stop"
        >
          توقف (ترمز)
        </button>
        <button
          class="btn btn-green"
          id="btn-fast"
        >
          حرکت / افزایش سرعت
        </button>
      </div>
    </div>

    <script
      type="module"
      src="./src/index.js"
    ></script>
  </body>
</html>

<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>بازی قطار سریع‌السیر مدرن</title>
    <link
      rel="shortcut icon"
      href="./favicon.ico"
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="./src/assets/css/index.css"
    />
  </head>
  <body>
    <div id="game-container">
      <div id="hud">
        <div class="hud-panel">
          <div>امتیاز: <span id="score-val">0</span></div>
          <div>مسافران: <span id="passengers-val">0</span> نفر</div>
        </div>
        <div class="hud-panel">
          <div id="station-alert">⚠️ نزدیک ایستگاه! ترمز کنید!</div>
          <div style="direction: ltr">
            SPEED: <span id="speed-val">0</span> km/h
          </div>
        </div>
      </div>

      <div
        class="mountain-layer"
        id="mountains"
      ></div>
      <div
        class="scenery-container"
        id="scenery-layer"
      ></div>

      <div id="railway-container">
        <div id="railway"></div>
      </div>

      <div id="train-group">
        <div class="wagon">
          <div class="wagon-windows"></div>
          <div class="wheel-pair">
            <div class="wheel"></div>
            <div class="wheel"></div>
          </div>
        </div>
        <div class="wagon">
          <div class="wagon-windows"></div>
          <div class="wheel-pair">
            <div class="wheel"></div>
            <div class="wheel"></div>
          </div>
        </div>
        <div class="wagon">
          <div class="wagon-windows"></div>
          <div class="wheel-pair">
            <div class="wheel"></div>
            <div class="wheel"></div>
          </div>
        </div>
        <div class="wagon">
          <div class="wagon-windows"></div>
          <div class="wheel-pair">
            <div class="wheel"></div>
            <div class="wheel"></div>
          </div>
        </div>
        <div class="wagon">
          <div class="wagon-windows"></div>
          <div class="wheel-pair">
            <div class="wheel"></div>
            <div class="wheel"></div>
          </div>
        </div>
        <div class="locomotive">
          <div class="cabin"></div>
          <div class="headlight"></div>
          <div
            class="wheel-pair"
            style="left: 15px; right: 15px"
          >
            <div class="wheel"></div>
            <div class="wheel"></div>
            <div class="wheel"></div>
          </div>
        </div>
      </div>

      <div id="controls-bar">
        <div class="control-group">
          <button
            class="btn btn-dark"
            id="btn-toggle-time"
          >
            ☀️ / 🌙 تغییر زمان
          </button>
        </div>

        <div class="control-group">
          <button
            class="btn btn-action"
            id="btn-clear-obstacle"
          >
            برطرف کردن مانع
          </button>
        </div>

        <div class="control-group">
          <button
            class="btn btn-blue"
            id="btn-slow"
          >
            کاهش سرعت
          </button>
          <button
            class="btn btn-red"
            id="btn-stop"
          >
            ترمز کامل
          </button>
          <button
            class="btn btn-green"
            id="btn-fast"
          >
            افزایش سرعت
          </button>
        </div>
      </div>
    </div>

    <script
      type="module"
      src="./src/index.js"
    ></script>
  </body>
</html>

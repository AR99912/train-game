<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>بازی مدیریت قطارهای مدرن و سریع‌السیر</title>
    <link
      rel="shortcut icon"
      href="./favicon.ico"
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="./src/assets/css/index.css"
    />
  </head>
  <body>
    <div
      id="game-container"
      class="noon"
    >
      <canvas
        id="blood-canvas"
        width="950"
        height="480"
      ></canvas>

      <div
        id="sun"
        class="sky-element"
      ></div>
      <div
        id="moon"
        class="sky-element"
      ></div>
      <div
        id="cloud1"
        class="sky-element cloud"
        style="left: 100px; transform: scale(0.8)"
      ></div>
      <div
        id="cloud2"
        class="sky-element cloud"
        style="left: 500px; transform: scale(0.6); top: 40px"
      ></div>

      <div id="hud">
        <div class="hud-row">
          <div class="hud-panel">
            <div>امتیاز: <span id="score-val">0</span></div>
            <div>ثروت: <span id="coin-val">0</span> 🪙</div>
            <div>مسافران: <span id="passengers-val">0</span> نفر</div>
          </div>

          <div class="speedometer-panel">
            <div>SPEEDOMETER</div>
            <span id="speed-val">0</span>
            <span style="font-size: 11px; color: #38bdf8">km/h</span>
          </div>

          <div class="hud-panel">
            <div id="station-alert">
              🚨 ایستگاه نزدیک است! سریعاً ترمز کنید!
            </div>
            <div style="text-align: right; font-size: 11.5px">
              📍 ایستگاه بعدی:
              <span id="next-station-name">درحال محاسبه...</span><br />
              فاصله: <span id="distance-val">0</span> کیلومتر | زمان رسیدن:
              <span id="eta-val">--</span>
            </div>
          </div>
        </div>
      </div>

      <div
        class="mountain-container"
        id="mountain-box"
      >
        <div
          class="mountain-layer"
          id="mountains"
        ></div>
        <div
          class="mountain-snow-caps"
          id="mountain-caps"
        ></div>
      </div>

      <div
        class="scenery-container"
        id="scenery-layer"
      ></div>

      <div id="railway-container">
        <div id="railway"></div>
      </div>

      <div
        id="train-group"
        class="train-maglev"
      >
        <div class="wagon">
          <div class="wagon-windows"></div>
          <div class="wheel-pair">
            <div class="wheel"></div>
            <div class="wheel"></div>
          </div>
        </div>
        <div class="wagon">
          <div class="wagon-windows"></div>
          <div class="wheel-pair">
            <div class="wheel"></div>
            <div class="wheel"></div>
          </div>
        </div>
        <div class="wagon">
          <div class="wagon-windows"></div>
          <div class="wheel-pair">
            <div class="wheel"></div>
            <div class="wheel"></div>
          </div>
        </div>
        <div class="wagon">
          <div class="wagon-windows"></div>
          <div class="wheel-pair">
            <div class="wheel"></div>
            <div class="wheel"></div>
          </div>
        </div>
        <div class="wagon">
          <div class="wagon-windows"></div>
          <div class="wheel-pair">
            <div class="wheel"></div>
            <div class="wheel"></div>
          </div>
        </div>
        <div class="locomotive">
          <div class="cabin"></div>
          <div class="headlight"></div>
          <div
            class="wheel-pair"
            style="left: 15px; right: 15px"
          >
            <div class="wheel"></div>
            <div class="wheel"></div>
            <div class="wheel"></div>
          </div>
        </div>
      </div>

      <div id="controls-bar">
        <div class="control-group">
          <button
            class="btn btn-dark"
            id="btn-toggle-time"
          >
            ⏰ چرخه زمان (ظهر)
          </button>
          <button
            class="btn btn-orange"
            id="btn-toggle-weather"
          >
            🌦️ فصل: تابستان
          </button>
          <button
            class="btn btn-purple"
            id="btn-change-style"
          >
            🔀 تعویض مدل قطار
          </button>
          <button
            class="btn btn-cyan"
            id="btn-horn"
          >
            📢 بوق (Space)
          </button>
        </div>

        <div class="control-group">
          <button
            class="btn btn-action"
            id="btn-clear-obstacle"
          >
            برطرف کردن مانع
          </button>
        </div>

        <div class="control-group">
          <button
            class="btn btn-blue"
            id="btn-slow"
          >
            کاهش سرعت
          </button>
          <button
            class="btn btn-red"
            id="btn-stop"
          >
            ترمز کامل
          </button>
          <button
            class="btn btn-green"
            id="btn-fast"
          >
            افزایش سرعت
          </button>
        </div>
      </div>
    </div>

    <script
      type="module"
      src="./src/index.js"
    ></script>
  </body>
</html>
